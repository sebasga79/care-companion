services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      # Puerto host inusual (49317) para no chocar con otros proyectos; el
      # contenedor sigue escuchando en 8000 internamente.
      - "49317:8000"
    environment:
      - APP_ENV=development
      - DATABASE_PATH=/app/data/care_companion.db
      - DATASET_DIR=/app/data/dataset
      - RAG_ALLOW_EMPTY_PDF_PASSWORD=${RAG_ALLOW_EMPTY_PDF_PASSWORD:-true}
      # En el primer arranque descarga el kit público e indexa el corpus en
      # el volumen. Los siguientes arranques reutilizan ambos sin repetirlo.
      - BOOTSTRAP_OFFICIAL_DATASET=${BOOTSTRAP_OFFICIAL_DATASET:-true}
      - BOOTSTRAP_OFFICIAL_CORPUS=${BOOTSTRAP_OFFICIAL_CORPUS:-true}
      - BOOTSTRAP_OFFICIAL_OCR=${BOOTSTRAP_OFFICIAL_OCR:-true}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # `fake` permite un smoke test sin credenciales. Para la evaluación
      # competitiva (G3), Compose acepta Groq/Llama mediante variables del
      # shell: LLM_PROVIDER=groq LLM_API_KEY=... docker compose up --build.
      - LLM_PROVIDER=${LLM_PROVIDER:-fake}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-fake-model-v1}
    volumes:
      - care_companion_data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # El navegador llama al api publicado en el host (puerto raro 49317).
        NEXT_PUBLIC_API_URL: http://localhost:49317
    ports:
      # Puerto host inusual (49318); el contenedor escucha en 3000.
      - "49318:3000"
    depends_on:
      - api

volumes:
  care_companion_data:
