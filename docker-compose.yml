services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_PATH=/app/data/care_companion.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_PROVIDER=fake
      - LLM_MODEL=fake-model-v1
    volumes:
      - care_companion_data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # El navegador llama al api publicado en el host (localhost:8000).
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  care_companion_data:
