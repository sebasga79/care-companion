services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      # Puerto host inusual (49317) para no chocar con otros proyectos; el
      # contenedor sigue escuchando en 8000 internamente.
      - "49317:8000"
    environment:
      - APP_ENV=development
      - DATABASE_PATH=/app/data/care_companion.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Producción del reto: LLM_PROVIDER=groq + LLM_API_KEY real (ver
      # .env.example y docs/auditoria-kit-oficial-2026-08-07.md §3). `fake`
      # es el default de este compose para que `docker compose up --build`
      # arranque sin credenciales (gate G2 no depende de tener una API key
      # a mano solo para levantar el contenedor).
      - LLM_PROVIDER=fake
      - LLM_MODEL=fake-model-v1
    volumes:
      - care_companion_data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # El navegador llama al api publicado en el host (puerto raro 49317).
        NEXT_PUBLIC_API_URL: http://localhost:49317
    ports:
      # Puerto host inusual (49318); el contenedor escucha en 3000.
      - "49318:3000"
    depends_on:
      - api

volumes:
  care_companion_data:
