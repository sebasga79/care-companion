services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      # Puerto host inusual (49317) para no chocar con otros proyectos; el
      # contenedor sigue escuchando en 8000 internamente.
      - "49317:8000"
    # Bug real encontrado en vivo (docs/auditoria-kit-oficial-2026-08-07.md
    # §9.x): antes esta sección sólo cableaba LLM_PROVIDER/LLM_API_KEY/
    # LLM_MODEL a mano desde variables del SHELL del host — `api/.env`, que
    # es donde de verdad se edita la config (Groq real, resguardo Ollama,
    # rate limiting), nunca se leía. El contenedor arrancaba con los
    # defaults (`fake`) sin que nada lo avisara: la conversación se veía
    # fluida porque FakeLLM responde instantáneo, así que "todo muy rápido"
    # en vivo era la señal correcta de que Groq no se estaba usando.
    # `env_file` carga TODO `api/.env` automáticamente — variables nuevas
    # ya no requieren tocar este archivo.
    env_file:
      - ./api/.env
    environment:
      - APP_ENV=development
      # Los tres siguientes SOBREESCRIBEN cualquier valor de api/.env: son
      # rutas dentro del contenedor, no del host, y api/.env trae las
      # rutas de desarrollo local (./data/...).
      - DATABASE_PATH=/app/data/care_companion.db
      - DATASET_DIR=/app/data/dataset
      - RAG_ALLOW_EMPTY_PDF_PASSWORD=${RAG_ALLOW_EMPTY_PDF_PASSWORD:-true}
      # En el primer arranque descarga el kit público e indexa el corpus en
      # el volumen. Los siguientes arranques reutilizan ambos sin repetirlo.
      - BOOTSTRAP_OFFICIAL_DATASET=${BOOTSTRAP_OFFICIAL_DATASET:-true}
      - BOOTSTRAP_OFFICIAL_CORPUS=${BOOTSTRAP_OFFICIAL_CORPUS:-true}
      - BOOTSTRAP_OFFICIAL_OCR=${BOOTSTRAP_OFFICIAL_OCR:-true}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # El resguardo Ollama corre en el host (Ollama.app), no en un
      # contenedor. Dentro del contenedor, "localhost" es el contenedor
      # mismo — Ollama ahí es "connection refused" siempre. Verificado:
      # localhost:11434 falla, host.docker.internal:11434 responde 200.
      # Sin esto, el resguardo queda inalcanzable justo cuando más se
      # necesita (Groq con rate limit).
      - LLM_FALLBACK_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - care_companion_data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # El navegador llama al api publicado en el host (puerto raro 49317).
        NEXT_PUBLIC_API_URL: http://localhost:49317
    ports:
      # Puerto host inusual (49318); el contenedor escucha en 3000.
      - "49318:3000"
    depends_on:
      - api

volumes:
  care_companion_data:
