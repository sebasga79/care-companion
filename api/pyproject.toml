[project]
name = "care-companion-api"
version = "0.1.0"
description = "Care Companion — backend monolito modular (FastAPI + SQLite WAL)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "numpy>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: se usa `assert` deliberadamente en tests y en invariantes internos.
# B008: `Depends(...)` en defaults es el patrón idiomático de FastAPI.
# S104: 0.0.0.0 es el bind default intencional para contenedores (docker-compose).
# UP042: `class X(str, Enum)` se mantiene explícito por portabilidad/legibilidad
#   en vez de `enum.StrEnum` (equivalente en 3.11+, elección estilística).
ignore = ["S101", "B008", "S104", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
